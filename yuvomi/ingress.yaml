apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yuvomi
  namespace: norriswu0
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - yuvomi
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yuvomi
                port:
                  number: 3000

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yuvomi-secrets
  namespace: norriswu0
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: norriswu0-secret-store
    kind: ClusterSecretStore
  target:
    name: yuvomi-secrets
    template:
      type: Opaque
      data:
        .env: |
          SESSION_SECRET={{ .SESSION_SECRET }}
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: /yuvomi/SESSION_SECRET

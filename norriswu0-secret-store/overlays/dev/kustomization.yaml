apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: norriswu0-dev

resources:
  - ../../base
  - infisical-universal-auth-sealed.yaml

patches:
  - target:
      kind: SecretStore
      name: norriswu0-secret-store
    patch: |-
      - op: replace
        path: /spec/provider/infisical/secretsScope/environmentSlug
        value: dev

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard
  namespace: norriswu0
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-dashboard
                port:
                  name: dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-api
  namespace: norriswu0
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes-api
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-api
                port:
                  name: api

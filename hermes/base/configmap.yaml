apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |
    _config_version: 33

    model:
      provider: deepseek
      default: deepseek-v4-flash

    terminal:
      backend: local

    approvals:
      mode: smart
      timeout: 300
      cron_mode: deny

    platforms:
      api_server:
        enabled: true
        extra:
          host: 0.0.0.0
          port: 8642

    dashboard:
      public_url: "https://hermes.hoki-sole.ts.net"
      oauth:
        provider: self-hosted
        self_hosted:
          issuer: "${HERMES_DASHBOARD_OIDC_ISSUER}"
          client_id: "${HERMES_DASHBOARD_OIDC_CLIENT_ID}"
          scopes: "openid profile email"

    discord:
      require_mention: true
      thread_require_mention: false
